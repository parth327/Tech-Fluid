<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0F172A"/>
  <!-- precision ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#F97316" stroke-width="20" opacity="0.35"/>
  <!-- cylinder barrel -->
  <rect x="102" y="179" width="205" height="154" rx="32" fill="none" stroke="#F97316" stroke-width="33"/>
  <!-- rod -->
  <line x1="307" y1="256" x2="384" y2="256" stroke="#F97316" stroke-width="41" stroke-linecap="round"/>
