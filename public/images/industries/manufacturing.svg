<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="ptitle">
  <title id="ptitle">Industrial hydraulic press on a factory floor</title>
  <defs>
    <linearGradient id="pSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17233B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#pSky)"/>

  <!-- factory window band -->
  <g opacity="0.35">
    <rect x="0" y="24" width="60" height="70" fill="none" stroke="#475569" stroke-width="2"/>
    <line x1="30" y1="24" x2="30" y2="94" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="59" x2="60" y2="59" stroke="#475569" stroke-width="2"/>
    <rect x="340" y="24" width="60" height="70" fill="none" stroke="#475569" stroke-width="2"/>
    <line x1="370" y1="24" x2="370" y2="94" stroke="#475569" stroke-width="2"/>
    <line x1="340" y1="59" x2="400" y2="59" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- floor -->
  <rect x="0" y="224" width="400" height="56" fill="#1E293B"/>
  <line x1="0" y1="224" x2="400" y2="224" stroke="#F97316" stroke-width="1.5" opacity="0.5"/>

  <!-- press frame -->
  <rect x="130" y="40" width="140" height="20" rx="2" fill="#F1F5F9"/>
  <rect x="140" y="60" width="16" height="120" fill="#334155"/>
  <rect x="244" y="60" width="16" height="120" fill="#334155"/>

  <!-- hydraulic ram housing -->
  <rect x="176" y="66" width="48" height="52" rx="4" fill="#0F172A" stroke="#F97316" stroke-width="2.5"/>
  <rect x="192" y="118" width="16" height="46" fill="#94A3B8"/>

  <!-- press platen (moving down onto workpiece) -->
  <rect x="150" y="164" width="100" height="18" rx="2" fill="#FDBA74" stroke="#F97316" stroke-width="2"/>
  <!-- motion arrows showing press stroke -->
  <path d="M160 140 V152" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M154 148 L160 156 L166 148" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M240 140 V152" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M234 148 L240 156 L246 148" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- workpiece / die bed -->
  <rect x="140" y="182" width="120" height="14" fill="#475569"/>
  <rect x="172" y="196" width="56" height="10" fill="#64748B"/>

  <!-- base -->
  <rect x="120" y="206" width="160" height="18" rx="2" fill="#F1F5F9"/>

  <!-- side control panel -->
  <rect x="66" y="150" width="34" height="56" rx="3" fill="#17233B" stroke="#475569" stroke-width="2"/>
  <circle cx="83" cy="164" r="5" fill="#F97316"/>
  <rect x="74" y="178" width="18" height="6" rx="1" fill="#94A3B8"/>
  <rect x="74" y="188" width="18" height="6" rx="1" fill="#94A3B8"/>
</svg>
