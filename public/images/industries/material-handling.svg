<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="mtitle">
  <title id="mtitle">Forklift lifting a pallet in a warehouse, representing material handling cylinders</title>
  <defs>
    <linearGradient id="mSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17233B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#mSky)"/>

  <!-- warehouse shelving backdrop -->
  <g opacity="0.4" stroke="#475569" stroke-width="2" fill="none">
    <rect x="20" y="40" width="70" height="150"/>
    <line x1="20" y1="80" x2="90" y2="80"/>
    <line x1="20" y1="120" x2="90" y2="120"/>
    <line x1="20" y1="160" x2="90" y2="160"/>
  </g>
  <rect x="30" y="52" width="24" height="20" fill="#334155" opacity="0.6"/>
  <rect x="60" y="92" width="24" height="20" fill="#334155" opacity="0.6"/>
  <rect x="30" y="132" width="24" height="20" fill="#334155" opacity="0.6"/>

  <!-- floor -->
  <rect x="0" y="224" width="400" height="56" fill="#1E293B"/>
  <line x1="0" y1="224" x2="400" y2="224" stroke="#F97316" stroke-width="1.5" opacity="0.5"/>

  <!-- forklift body -->
  <rect x="150" y="168" width="90" height="46" rx="5" fill="#F1F5F9"/>
  <rect x="160" y="150" width="46" height="24" rx="3" fill="#0F172A" opacity="0.7"/>
  <rect x="150" y="150" width="10" height="40" fill="#FDBA74"/>
  <circle cx="172" cy="220" r="13" fill="#0F172A" stroke="#94A3B8" stroke-width="3"/>
  <circle cx="220" cy="220" r="13" fill="#0F172A" stroke="#94A3B8" stroke-width="3"/>

  <!-- mast (hydraulic lift) -->
  <rect x="246" y="70" width="8" height="146" fill="#334155"/>
  <rect x="278" y="70" width="8" height="146" fill="#334155"/>
  <!-- lift carriage + forks, raised -->
  <rect x="238" y="108" width="56" height="10" fill="#F97316"/>
  <line x1="244" y1="118" x2="244" y2="140" stroke="#F97316" stroke-width="8" stroke-linecap="round"/>
  <line x1="288" y1="118" x2="288" y2="140" stroke="#F97316" stroke-width="8" stroke-linecap="round"/>

  <!-- pallet + crates lifted by the forks -->
  <rect x="230" y="140" width="70" height="10" fill="#94A3B8"/>
  <rect x="238" y="104" width="26" height="26" fill="#FDBA74" stroke="#F97316" stroke-width="2"/>
  <rect x="266" y="96" width="26" height="34" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>

  <!-- hydraulic ram detail beside the mast -->
  <rect x="258" y="150" width="10" height="60" rx="3" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.75"/>
</svg>
