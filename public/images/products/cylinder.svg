<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="cyltitle">
  <title id="cyltitle">Precision hydraulic cylinder, double-acting, with rod extended</title>
  <defs>
    <linearGradient id="prodSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17233B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="rodGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="45%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#prodSky)"/>
  <g opacity="0.5">
    <line x1="0" y1="60" x2="400" y2="60" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="220" x2="400" y2="220" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- mounting flange -->
  <rect x="34" y="112" width="18" height="56" rx="2" fill="#1E293B" stroke="#FDBA74" stroke-width="2.5"/>

  <!-- barrel -->
  <rect x="52" y="96" width="150" height="88" rx="10" fill="#17233B" stroke="#F97316" stroke-width="3"/>
  <rect x="66" y="108" width="122" height="10" rx="5" fill="#FFFFFF" opacity="0.06"/>

  <!-- piston + rod -->
  <rect x="196" y="104" width="16" height="72" fill="#F97316"/>
  <rect x="212" y="126" width="150" height="28" fill="url(#rodGrad2)"/>
  <rect x="212" y="126" width="150" height="6" fill="#FFFFFF" opacity="0.4"/>
  <rect x="330" y="118" width="16" height="44" rx="3" fill="#1E293B" stroke="#94A3B8" stroke-width="2.5"/>
  <circle cx="360" cy="140" r="9" fill="#0F172A" stroke="#94A3B8" stroke-width="3"/>

  <!-- pressure lines -->
  <path d="M84 96 V70 H140" stroke="#F97316" stroke-width="2" fill="none" stroke-dasharray="5 5" opacity="0.7"/>
  <path d="M170 184 V208 H120" stroke="#F97316" stroke-width="2" fill="none" stroke-dasharray="5 5" opacity="0.5"/>

  <!-- spec chips -->
  <text x="60" y="220" font-family="JetBrains Mono, monospace" font-size="12" fill="#94A3B8">BORE &#8960; 100mm</text>
  <text x="240" y="220" font-family="JetBrains Mono, monospace" font-size="12" fill="#94A3B8">STROKE 450mm</text>
</svg>
