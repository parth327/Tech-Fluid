<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="jacktitle">
  <title id="jacktitle">High-tonnage hydraulic bottle jack lifting a load</title>
  <defs>
    <linearGradient id="jackSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17233B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#jackSky)"/>
  <line x1="0" y1="220" x2="400" y2="220" stroke="#334155" stroke-width="1" opacity="0.5"/>

  <!-- load platform above the jack -->
  <rect x="120" y="88" width="160" height="16" rx="3" fill="#F1F5F9"/>
  <rect x="140" y="66" width="120" height="24" rx="3" fill="#334155" stroke="#94A3B8" stroke-width="2"/>
  <text x="200" y="82" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">LOAD</text>

  <!-- lift arrows -->
  <path d="M170 60 V44" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M163 50 L170 42 L177 50" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M230 60 V44" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M223 50 L230 42 L237 50" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- ram (extended) -->
  <rect x="188" y="104" width="24" height="52" fill="#F97316"/>
  <rect x="192" y="104" width="6" height="52" fill="#FFFFFF" opacity="0.35"/>

  <!-- jack body (bottle) -->
  <path d="M172 156 h56 l-8 40 h-40 z" fill="#17233B" stroke="#F97316" stroke-width="3" stroke-linejoin="round"/>
  <rect x="176" y="168" width="48" height="10" fill="#FFFFFF" opacity="0.06"/>

  <!-- release valve handle -->
  <rect x="228" y="176" width="34" height="8" rx="3" fill="#334155" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="264" cy="180" r="6" fill="#94A3B8"/>

  <!-- wide base -->
  <path d="M148 196 H252 L238 220 H162 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- rating plate -->
  <rect x="70" y="150" width="70" height="46" rx="4" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
  <text x="105" y="170" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#F97316">50T</text>
  <text x="105" y="186" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#94A3B8">CAPACITY</text>
</svg>
